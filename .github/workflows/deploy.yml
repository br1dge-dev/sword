name: Deploy (Vercel hook)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    # Only deploy when CI succeeded AND it was a run for main branch
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Missing GitHub secret: DEPLOY_HOOK"
            exit 1
          fi
          echo "Triggering deploy hook (URL hidden)..."
          # Do not print the URL to logs. Expect 2xx.
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Deploy hook responded with HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi


